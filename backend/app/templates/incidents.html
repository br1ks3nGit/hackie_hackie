{% extends "base.html" %}
{% block title %}Incidents - DriveScore Insurer{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-text">Incidents</h1>
<form method="get" action="/dashboard/incidents" class="card mt-4 flex flex-wrap items-end gap-4"
      hx-get="/dashboard/partials/incidents" hx-trigger="change" hx-target="#incidents-table" hx-swap="outerHTML" hx-indicator="#incidents-loading" hx-disabled-elt="select">
  <div class="flex flex-col gap-1">
    <label for="status" class="text-sm font-medium text-text">Confirmation</label>
    <select id="status" name="status" class="input pr-8">
      <option value=""{% if not status %} selected{% endif %}>All</option>
      {% for value, label in status_options.items() %}<option value="{{ value }}"{% if status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <noscript><button type="submit" class="btn btn-secondary">Apply</button></noscript>
</form>
<div class="mt-4">
  <div class="flex items-center gap-3">
    {% include "partials/incidents_count.html" %}
    <span id="incidents-loading" class="htmx-indicator text-sm text-text-muted" aria-hidden="true">Loading...</span>
  </div>
  {% include "partials/incidents_table.html" %}
</div>
{% endblock %}

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      INSURER_API_KEY: ci-dummy-insurer-key
      DRIVER_API_KEY_SALT: ci-dummy-driver-salt
      TEST_DATABASE_URL: postgresql+psycopg://drivescore:drivescore@localhost:5432/drivescore_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drivescore
          POSTGRES_PASSWORD: drivescore
          POSTGRES_DB: drivescore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivescore -d drivescore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -q

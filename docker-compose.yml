services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drivescore
      POSTGRES_PASSWORD: drivescore
      POSTGRES_DB: drivescore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb.sql:/docker-entrypoint-initdb.d/01-initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivescore -d drivescore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

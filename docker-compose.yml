services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drivescore
      POSTGRES_PASSWORD: drivescore
      POSTGRES_DB: drivescore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb.sql:/docker-entrypoint-initdb.d/01-initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivescore -d drivescore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://drivescore:drivescore@db:5432/drivescore
      INSURER_API_KEY: ${INSURER_API_KEY:?set INSURER_API_KEY}
      DRIVER_API_KEY_SALT: ${DRIVER_API_KEY_SALT:?set DRIVER_API_KEY_SALT}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DATA_DIR: /data/raw
      MODEL_PATH: /models/model.pkl
    volumes:
      - rawdata:/data/raw
      - models:/models
    ports:
      # Bound to all interfaces on purpose: phones on the LAN must reach the API.
      - "0.0.0.0:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  rawdata:
  models:
